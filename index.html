<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hangman Game</title>
    <link rel="stylesheet" href="hang.css" />
  </head>
  <body>
    <div class="container">
      <div class="game-info">
        <div class="game-name">Hangman</div>
        <div class="category">Word From: <span></span></div>
      </div>
      <hr />
      <div class="row">
        <div class="hangman-draw">
          <div class="the-draw">
            <div class="the-stand"></div>
            <div class="the-hang"></div>
            <div class="the-rope"></div>
            <div class="the-man">
              <div class="head"></div>
              <div class="body"></div>
              <div class="hands"></div>
              <div class="legs"></div>
            </div>
          </div>
        </div>
        <div class="letters"></div>
      </div>
      <hr />
      <div class="letters-guess"></div>
    </div>
    <audio id="good" src="./audio/sounds_good.mp3" preload="auto"></audio>
    <audio id="bad" src="./audio/sounds_bad.mp3" preload="auto"></audio>
    <audio id="won" src="./audio/sounds_success.mp3" preload="auto"></audio>
    <audio id="failed" src="./audio/sounds_failed.mp3" preload="auto"></audio>
    <script src="hang.js"></script>
  </body>
</html>
